# Die Auslieferung der Einstiegsseite und des Betriebsstands (FR-31, FR-30).
#
# **Warum es diese Datei gibt.** Am 18.10.2026 scrapete Prometheus den
# Betriebsstand erstmals und lehnte ihn ab:
#
#   received unsupported Content-Type "application/octet-stream" and no
#   fallback_scrape_protocol specified for target
#
# `serving.betriebsstand` schreibt `metrics` - eine Datei **ohne Endung**.
# nginx kennt dafuer keinen Typ und nimmt `application/octet-stream`, und
# Prometheus 3 verlangt einen deklarierten Typ, statt wie frueher stillschweigend
# zu raten. Der Fehler liegt damit beim Endpunkt und nicht beim Scrape: Ein
# Exporter, der seinen Typ nicht nennt, ist unvollstaendig.
#
# **Warum nicht `fallback_scrape_protocol` im Scrape.** Das waere eine Zeile im
# fremden Monitoring-Stapel und wuerde die Ursache verdecken - jeder weitere
# Verbraucher dieses Endpunkts bekaeme weiter den falschen Typ. Die Deklaration
# gehoert dorthin, wo ausgeliefert wird.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # **Die eine Zeile, um die es geht.** Das Textformat von Prometheus, mit
    # Version: `text/plain; version=0.0.4` ist der Typ, den Prometheus 3 ohne
    # Rueckfallregel annimmt.
    location = /metrics {
        default_type "text/plain; version=0.0.4; charset=utf-8";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
