# frische Klon 2.5.3. Ein Test, der hier gruen ist und dort rot, ist dann
# nicht mehr auf den Code zurueckzufuehren.
#
# CI installiert aus dieser Datei. Entwickler duerfen weiter requirements.txt
# nehmen; wer denselben Stand wie CI will:
#
#   python -m pip install -r requirements.lock && python -m pip install -e . --no-deps
#
