# Der woechentliche Datenlauf: laedt alle fuenf Quellen, baut Silver, Gold und
# Serving - und laesst dann die Tests laufen, die ein frischer Klon nicht
# ausfuehren kann.
#
# Warum es das braucht: tests.yml prueft auf jedem Pull Request 658 von 698
# Tests. Die 40 uebrigen brauchen gebaute Daten - und das sind ausgerechnet
# die Waechter: Zahlen in den Abgabedokumenten gegen die Parquet-Dateien, die
# Einwohnerprobe der Stadtzuordnung, "kein Delikt in der falschen Stadt".
# Bis zu diesem Workflow liefen sie nur, wenn jemand lokal pytest tippte.
# CI bewies den Code, nicht die Daten.
#
# Die Quellen bewegen sich: Detroit aendert Eintraege noch Jahre nach der
# Tat, Chicago liefert Deltas. Ein frischer Lauf baut deshalb andere Zahlen
# als die, die in ln1_konzept.md stehen - jede Woche. Bis zum 13.9. war der
# Lauf deswegen rot, und ein Alarm, der immer klingelt, ist keiner. Seither
# gilt: Die Waechter, die dokumentierte Zahlen gegen Daten halten (Marker
# "referenzstand"), laufen hier nicht; sie gelten fuer den Referenzstand auf
# dem eigenen Rechner. Stattdessen weist orchestration.drift die Abweichung
# als Zahl je Groesse aus - in der Job-Zusammenfassung und als Artefakt.
# Rot heisst hier nur noch: Die Strecke oder ein Test, der auf frischen Daten
# gelten muss, ist kaputt.
#
# Was der Lauf braucht: CENSUS_API_KEY als Repository-Secret (Settings ->
# Secrets and variables -> Actions). Ohne ihn liefert die Census-API HTTP 200
# mit einer HTML-Seite "Missing Key"; die Pipeline erkennt das und bricht ab.
# Der erste Schritt prueft das Secret deshalb vorab und sagt, was fehlt.
# SOCRATA_APP_TOKEN ist optional; ohne ihn ist Chicago nur langsamer.
#
# Was der Lauf NICHT tut: Daten committen. data/ bleibt aus der Versionierung
# ausgeschlossen. Was bleibt, ist ein Artefakt mit dem Gesamtmanifest -
# welche Laeufe, welcher Fingerabdruck, wie alt jede Quelle - und dem
# Testprotokoll.

name: Datenlauf

on:
  schedule:
    # Montags 06:00 UTC. Frueh genug, dass ein rotes Ergebnis die Woche
    # eroeffnet, statt am Freitag vor der Abgabe aufzufallen.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      ohne_ingestion:
        description: "Nur neu ableiten? (Braucht vorher geladene Daten - in CI praktisch nie.)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: datenlauf
  cancel-in-progress: false

jobs:
  datenlauf:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Secret vorhanden?
        # Vorab statt bei Stufe 5 von 13. Eine Ingestion, die zwanzig Minuten
        # laeuft und dann an einem fehlenden Schluessel stirbt, ist die
        # teuerste Art, es zu erfahren.
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          if [ -z "$CENSUS_API_KEY" ]; then
            echo "::error::CENSUS_API_KEY fehlt als Repository-Secret. Kostenlos unter https://api.census.gov/data/key_signup.html, dann Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "CENSUS_API_KEY ist gesetzt."

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Die ganze Strecke
        # Der Controller kennt die Reihenfolge und bricht beim ersten Fehler
        # ab. Die Schluessel kommen als Umgebungsvariablen; die Pipelines
        # lesen sie ueber os.getenv, eine .env-Datei braucht es dafuer nicht.
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          # Acht Tage: Wochentakt plus Reserve, NOAAs vier Tage Nachlauf
          # eingeschlossen. Liefert eine Quelle nichts Neues, faellt der
          # Lauf - das ist die Freshness-Kontrolle, die es bisher nicht gab.
          if [ "${{ inputs.ohne_ingestion }}" = "true" ]; then
            python -m orchestration.run_all --ohne-ingestion --maximal-alter-tage 8
          else
            python -m orchestration.run_all --maximal-alter-tage 8
          fi

      - name: Die Notebooks, die Zahlen belegen
        # Sechs von zwoelf. Die Linie: Notebooks, die Zahlen belegen, laufen;
        # Notebooks, die laden (01, 02, 11, 12, 21, 22), nicht - sie wuerden
        # hier zusaetzliche Bronze-Laeufe erzeugen.
        #
        # Warum ueberhaupt: Notebook 32 war seit der city=-Umbenennung (#39)
        # still kaputt - "Kein Detroit-Bronze-Lauf", obwohl zwei da lagen.
        # Einen Tag lang hat es niemand gemerkt, weil es niemand ausfuehrte.
        # Diese Notebooks sind die Belege der Abgabe; ein Beleg, der nicht
        # mehr laeuft, ist keiner.
        run: |
          set -euo pipefail
          for nb in 03_chicago_data_quality 13_detroit_data_quality \
                    31_storage_evaluation 32_nibrs_source \
                    33_serving_evaluation 34_gold_sternschema; do
            echo "== $nb"
            python -m jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=1200 \
              --output-dir ausgefuehrt "notebooks/$nb.ipynb"
          done

      - name: Ausgefuehrte Notebooks sichern
        # Mit Ausgaben - das ist der Stand, den die Zahlen im Konzept
        # beschreiben sollen. Wer eine Folie macht, kann hier nachsehen.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebooks-ausgefuehrt
          path: ausgefuehrt/
          if-no-files-found: warn
          retention-days: 90

      - name: Alle Tests, jetzt mit Daten
        # Hier laufen die Tests, die ein Pull Request ueberspringt - bis auf
        # die Waechter des Referenzstands. Die waeren auf frischen Daten jede
        # Woche rot; ihre Abweichung weist der naechste Schritt als Zahl aus.
        run: python -m pytest -q -rs -m "not referenzstand"

      - name: Drift ausweisen
        # Auch wenn die Tests rot sind, auch wenn die Strecke abgebrochen ist -
        # dann steht "nicht gebaut" in der Zeile. Das Werkzeug scheitert nie.
        if: always()
        run: python -m orchestration.drift --summary "$GITHUB_STEP_SUMMARY" --json data/drift.json

      - name: Gesamtmanifest sichern
        # Auch wenn die Tests rot sind - gerade dann. Das Manifest sagt,
        # welche Laeufe es waren und wie alt jede Quelle ist; die Drift sagt,
        # wie weit die Dokumente davon entfernt sind.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline_run
          path: |
            data/pipeline_run.json
            data/drift.json
          if-no-files-found: warn
          retention-days: 90
