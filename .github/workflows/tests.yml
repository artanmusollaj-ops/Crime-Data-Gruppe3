# Die Testsuite auf jedem Pull Request und auf main.
#
# Warum es das braucht: Bis September 2026 liefen die Tests nur, wenn jemand
# daran dachte. Zweimal ist dabei eine Zahl in den Abgabedokumenten veraltet,
# ohne dass etwas rot wurde - gefunden hat es beide Male ein Zufall. Seit es
# Waechter fuer diese Zahlen gibt, muessen sie auch automatisch laufen.
#
# Was hier NICHT geprueft wird: die Zahlen gegen die gebauten Daten. `data/`
# ist aus der Versionierung ausgeschlossen, ein frischer Klon hat es also
# nicht. Der Standardlauf waehlt diese 81 Waechter ohnehin ab (Marker
# `referenzstand`, Begruendung in pyproject.toml), und die uebrigen
# datengebundenen Tests ueberspringen sich selbst. Was laeuft, sind die 1'405
# von 1'486 Tests des Standardlaufs: beide Testzahl-Waechter, die
# Reproduzierbarkeit der Crosswalks aus den PDFs und die Form der Dokumente.
#
# **Warum so wenige Jobs.** Bis zum 3.10.2026 lief eine Matrix aus zwei
# Betriebssystemen und zwei Python-Versionen, dazu ruff und der Referenzbau -
# sechs Jobs, rund 34 verrechnete Minuten je Lauf. Windows wird zum doppelten
# Satz abgerechnet und brauchte doppelt so lange wie Linux: allein die beiden
# Windows-Jobs waren 26 dieser 34 Minuten. Am 1. Oktober liefen acht Laeufe,
# also etwa 270 Minuten an einem Tag, und das Budget war weg. Seither gilt der
# Zuschnitt unten: ein Pull Request kostet rund vier Minuten, ein Push auf
# main siebzehn.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Montags 05:00 UTC, eine Stunde vor dem Datenlauf: der Kanarienvogel
    # unten soll nicht mit ihm um einen Runner konkurrieren.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Ein neuer Push auf denselben Branch macht den laufenden Test ueberfluessig.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefung:
    # Der Job, der auf jedem Pull Request laeuft - und der einzige.
    #
    # Python 3.11, installiert aus den Bereichen in pyproject.toml: Das
    # Lockfile kann es nicht, numpy 2.5 verlangt Python 3.12. Genau das ist
    # der Zweck - die Zusage `requires-python = ">=3.11"` muss mit den
    # erlaubten Bereichen noch stimmen. Faellt dieser Job an der
    # Installation, ist die Untergrenze keine Zusage mehr, sondern eine
    # Behauptung.
    #
    # Linux, weil die drei PDF-Reproduktionen hier zuhause sind: Windows hat
    # ein anderes pdftotext, ein anderer Poppler-Build setzt die Spalten
    # anders, und alle drei Tests haengen am Layout. Sie sind gegen
    # poppler-utils definiert und ueberspringen sich anderswo.
    #
    # ruff laeuft im selben Job statt in einem eigenen. Pyflakes braucht
    # vierzehn Sekunden, ein eigener Job wird trotzdem mit einer ganzen
    # Minute verrechnet. Vorangestellt bleibt es: es findet in Sekunden, wofuer
    # die Suite Minuten braucht, und Fehler, die kein Test sieht.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: poppler-utils
        # Liefert pdftotext fuer die drei PDF-Reproduktionen.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Abhaengigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: ruff
        run: ruff check src tests tools

      - name: Tests
        # Kein Netz noetig und kein Schluessel: Die Werkzeug-Tests fallen auf
        # die versionierten Kataloge zurueck, wenn ein Portal nicht antwortet.
        run: python -m pytest -q -rs

  windows:
    # Nur auf main, nicht auf jedem Pull Request. Windows hat genau einen
    # Fehler gefunden, der sonst niemandem auffiel - beide PDF-Werkzeuge
    # trennten auf `\n` und liessen das `\r` an jeder Zeile stehen, ein
    # echter Portabilitaetsfehler. Das ist wertvoll und rechtfertigt nicht,
    # dreizehn Minuten je Push zu bezahlen. Artan entwickelt auf Windows;
    # eine Anleitung mit PowerShell-Befehlen und ein CI, das sie nie
    # ausfuehrt, widersprechen sich weiterhin - nur eben je main-Push.
    #
    # Hier das Lockfile und Python 3.13: derselbe Stand wie ein Entwickler,
    # der ihn nachstellt. Der Bereichs-Pfad ist oben abgedeckt.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Abhaengigkeiten installieren
        # shell: bash auch unter Windows. PowerShell bricht bei einem
        # gescheiterten pip nicht ab - der erste Windows-Lauf installierte
        # nichts und meldete dann "No module named pytest".
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Tests
        # Die drei PDF-Reproduktionen ueberspringen sich hier mit Begruendung;
        # -rs macht das sichtbar, statt es zu verschweigen.
        run: python -m pytest -q -rs

  kanarienvogel:
    # Woechentlich, auf dem neuesten stabilen Python.
    #
    # Warum es das braucht: pyproject.toml sagt `>=3.11` ohne Obergrenze, und
    # das soll so bleiben. Eine Zusage nach oben offen zu halten und nie zu
    # pruefen, ist aber genau der Zustand, in dem Python 3.14 `\z` statt `\Z`
    # schrieb: `glob_regex` schnitt nur `\Z` ab, jedes Muster mit Platzhalter
    # in einem nicht letzten Segment traf auf nichts, und die S3-Seite des
    # hybrid-Modus fand **still null Laeufe**. Behoben ist das (siehe
    # storage.backend); unbemerkt bleiben soll der naechste solche Fall nicht.
    #
    # `3.x` loest absichtlich auf die jeweils neueste Fassung auf. Dieser Job
    # darf rot werden, ohne dass jemand etwas geaendert hat - das ist sein
    # Zweck, und deshalb blockiert er keinen Pull Request. Installiert wird
    # aus den Bereichen: das Lockfile hat fuer eine brandneue Version noch
    # keine Wheels.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Welches Python ist das?
        # In der Zusammenfassung nachlesbar, ohne das Protokoll zu oeffnen.
        run: |
          echo "### Kanarienvogel auf $(python -V)" >> "$GITHUB_STEP_SUMMARY"

      - name: poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Abhaengigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q -rs
