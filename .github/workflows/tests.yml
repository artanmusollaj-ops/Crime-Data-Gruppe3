# Die Testsuite auf jedem Pull Request und auf main.
#
# Warum es das braucht: Bis September 2026 liefen die Tests nur, wenn jemand
# daran dachte. Zweimal ist dabei eine Zahl in den Abgabedokumenten veraltet,
# ohne dass etwas rot wurde - gefunden hat es beide Male ein Zufall. Seit es
# Waechter fuer diese Zahlen gibt, muessen sie auch automatisch laufen.
#
# Was hier NICHT geprueft wird: die Zahlen gegen die gebauten Daten. `data/`
# ist aus der Versionierung ausgeschlossen, ein frischer Klon hat es also
# nicht - die betroffenen Tests ueberspringen sich selbst. Was laeuft, ist
# alles uebrige: 1'061 von 1'142 Tests, darunter beide Testzahl-Waechter, die
# Reproduzierbarkeit der Crosswalks aus den PDFs und die Form der Dokumente.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Ein neuer Push auf denselben Branch macht den laufenden Test ueberfluessig.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    # Zuerst und allein: Pyflakes findet in Sekunden, wofuer die Suite zwei
    # Minuten braucht - und Fehler, die kein Test sieht.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.16.7
      - run: ruff check src tests tools

  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.11 ist die Untergrenze aus pyproject.toml, 3.13 die Version, auf
        # der entwickelt wird. Windows, weil Artan darauf entwickelt - eine
        # Anleitung mit PowerShell-Befehlen und ein CI, das sie nie ausfuehrt,
        # widersprechen sich.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: poppler-utils
        # Liefert pdftotext. Die Werkzeuge unter tools/ lesen damit die
        # amtlichen PDFs, und drei Tests pruefen, dass sich die Crosswalks
        # daraus byteweise reproduzieren lassen. Nur unter Linux: Der
        # Windows-Runner hat zwar ein pdftotext, aber ein anderer Build setzt
        # die Spalten anders, und alle drei PDF-Reproduktionen haengen am
        # Layout. Sie sind gegen poppler-utils definiert und ueberspringen
        # sich unter Windows mit genau dieser Begruendung. Windows prueft, ob
        # der Code laeuft - und hat dabei den \r-Fehler in beiden
        # PDF-Werkzeugen gefunden.
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Abhaengigkeiten installieren
        # Zwei Wege, mit Absicht. 3.13 installiert aus dem Lockfile: derselbe
        # Stand wie ein Entwickler, der ihn nachstellt. 3.11 installiert aus
        # den Bereichen in pyproject.toml - das Lockfile kann es nicht, numpy
        # 2.5 verlangt Python 3.12, und genau das prueft dieser Job: dass die
        # Zusage "3.11 oder neuer" mit den erlaubten Bereichen noch stimmt.
        #
        # shell: bash auch unter Windows. PowerShell bricht bei einem
        # gescheiterten pip nicht ab - der erste Windows-Lauf installierte
        # nichts und meldete dann "No module named pytest".
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ "${{ matrix.python }}" = "3.13" ]; then
            python -m pip install -r requirements.lock
            python -m pip install -e . --no-deps
          else
            python -m pip install -r requirements.txt
          fi

      - name: Tests
        # Kein Netz noetig und kein Schluessel: Die Werkzeug-Tests fallen auf
        # die versionierten Kataloge zurueck, wenn ein Portal nicht antwortet.
        run: python -m pytest -q -rs

  referenz:
    # Baut die Code-Referenz aus den Docstrings und haengt sie an den Lauf.
    #
    # Warum nur auf main: Dass der Bau gelingt, pruefen die Tests auf jedem
    # Pull Request ohnehin - sie bauen ihn sogar zweimal. Was dieser Job
    # hinzufuegt, ist das fertige Nachschlagewerk zum Herunterladen, ohne dass
    # jemand Python installiert. Das braucht es fuer den Stand auf main, nicht
    # fuer jeden Zwischenstand.
    if: github.event_name == 'push'
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Abhaengigkeiten installieren
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Referenz bauen
        run: python tools/build_referenz.py
      - uses: actions/upload-artifact@v4
        with:
          name: code-referenz
          path: docs/referenz/
          # Laenger als der Abstand zweier Pushes auf main, kuerzer als der
          # Vorrat, den niemand mehr zuordnen kann.
          retention-days: 30
