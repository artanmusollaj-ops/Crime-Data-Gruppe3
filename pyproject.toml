# Projektdefinition fuer Crime-Data-Gruppe3.
#
# Die drei Pipelines liegen unter src/crime/ und werden von hier aus als
# Pakete bekannt gemacht. Mit einer editierbaren Installation
#
#     python -m pip install -r requirements.txt
#
# sind census_pipeline, chicago_pipeline und detroit_pipeline ueberall
# importierbar, ohne dass PYTHONPATH gesetzt werden muss.
#
# packages.find weiter unten sucht ohne include/exclude und erfasst damit jedes
# Verzeichnis unter src/crime/ mit einer __init__.py. Eine neue Pipeline braucht
# hier also keinen Eintrag.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crime-data-gruppe3"
version = "0.1.0"
description = "Ingestion und Aufbereitung von Kriminalitaetsdaten aus Chicago und Detroit"
requires-python = ">=3.11"
dependencies = [
    # Werkzeug fuer Silver und Gold (Absprache 5.3). Die spatial-Extension
    # wird zur Laufzeit geladen und ist deshalb keine Paketabhaengigkeit.
    "duckdb>=1.1,<2",
    "pandas>=2.2,<4",
    "pyarrow>=18,<30",
    # Liest die TIGER-Shapefiles direkt aus dem ZIP nach Arrow, mit der
    # Geometrie als WKB - deutlich leichter als geopandas, das dafuer nicht
    # noetig ist.
    "pyogrio>=0.8,<1",
    "python-dotenv>=1.1,<2",
    # SeaweedFS ueber S3 (STORAGE_BACKEND=s3|hybrid). Im local-Modus wird es
    # nie importiert; DuckDB liest S3 ueber httpfs, nicht ueber boto3.
    "boto3>=1.35,<2",
    "requests>=2.32,<3",
    # SOURCE_TIMEZONE = ZoneInfo("America/Detroit") wird beim Import von
    # detroit_pipeline ausgewertet. Ohne IANA-Datenbank schlaegt schon der
    # Import fehl - auf Windows immer, auf schlanken Linux-Images (Alpine,
    # manche CI-Images) ebenfalls. Deshalb ohne Plattform-Marker.
    "tzdata",
    "urllib3>=2,<3",
]

[project.optional-dependencies]
admin = ["flask>=3.1,<4", "PyJWT[crypto]>=2.10,<3", "gunicorn>=23,<27; sys_platform != 'win32'"]
dev = [
    "pytest>=8,<10",
    # Liest die IEPD-Arbeitsmappe von Illinois - die zweite Quelle fuer die
    # 81 NIBRS-Bezeichnungen. Ohne sie ueberspringen sich sechs Tests
    # stillschweigend, und die Codeliste haette wieder nur eine Quelle.
    "openpyxl>=3.1,<4",
    # Statische Pruefung. 694 Tests fingen zwei Fehler eines Tages nicht -
    # einen falschen Modulalias und eine doppelt vergebene Variable. Pyflakes
    # meldet beides, bevor ein Test laeuft.
    "ruff>=0.16,<1",
    # Fuehrt die Notebooks im woechentlichen Datenlauf aus. Notebook 32 war
    # seit der city=-Umbenennung still kaputt - einen Tag lang, unbemerkt,
    # weil es niemand ausfuehrte. Das sind die Belege der Abgabe.
    "nbconvert>=7.16,<8",
    "ipykernel>=6.29,<7",
    # Liest die GitHub-Workflows, damit `tests/test_workflow_shell.py` jeden
    # `run:`-Block durch `bash -n` schicken kann. **Undeklariert hat es die
    # dokumentierte Testzahl unhaltbar gemacht:** Der Aufruf steht in den
    # Argumentwerten eines `parametrize`, also faellt er beim *Sammeln* - und
    # ohne PyYAML sammelte CI 23 Tests weniger als jeder
    # Entwicklungsrechner. Vier Dokumentwaechter verglichen ihre Zahl mit
    # dieser kleineren und waren deshalb auf jedem Pull Request rot, vom
    # 29.9. bis zum 18.10.2026. Dass genau die 23 ausfielen, die die Shell
    # in den Workflows pruefen, war der teuerste Teil: Sie liefen nur dort,
    # wo die Workflows gar nicht laufen.
    "pyyaml>=6,<7",
    # Erzeugt die Code-Referenz aus den Docstrings (tools/build_referenz.py).
    # Das Projekt hat mehr Erklaerung als Code; sie lag bis dahin nur im
    # Quelltext. pdoc ist die einzige Abhaengigkeit, die nichts baut und
    # nichts prueft - sie macht Vorhandenes lesbar.
    "pdoc>=15,<16",
    # Die Engineering-Konsole (platform_admin) und ihre Tests. Doppelt mit
    # [admin], weil CI nur [dev] installiert: Ohne Flask fielen ihre Tests
    # beim Sammeln, und die Testzahl hinge davon ab, wer was installiert hat.
    "flask>=3.1,<4",
    "PyJWT[crypto]>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["src/crime"]

[tool.setuptools.package-data]
platform_admin = ["static/*.html"]
"serving.dashboard" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Der Standardlauf waehlt den Marker referenzstand ab. Grund: Diese Waechter
# halten dokumentierte Zahlen gegen die *gebauten* Daten und sind rot, sobald
# die Daten weiterlaufen und die Dokumente noch nicht nachgezogen sind - ein
# normaler Zwischenzustand, aber er liess "python -m pytest" dutzendfach rot
# aussehen und verdeckte echte Fehler. Sie sind nicht abgeschaltet, nur nicht
# mehr im Weg:
#
#     python -m pytest                     alles ausser dem Referenzstand
#     python -m pytest -m referenzstand    genau diese Waechter
#     python -m pytest -m ""               beides zusammen
#
# Die Summenzeile nennt die abgewaehlten weiterhin ("71 deselected"), damit
# niemand sie fuer verschwunden haelt.
addopts = "-q -m 'not referenzstand'"
# Fallback, damit die Tests auch ohne Installation laufen.
pythonpath = ["src/crime"]
markers = ["referenzstand: dokumentierte Zahlen gegen gebaute Daten"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Bewusst schmal: nur, was ein Fehler ist, nichts, was Geschmack ist.
#   E4, E7, E9  Import-, Anweisungs- und Laufzeitfehler aus pycodestyle
#   F           Pyflakes - ungenutzte Importe, undefinierte Namen, doppelte
#               Argumente. Die Klasse Fehler, die Tests nicht sehen.
#   B904        raise ohne "from" im except - verschluckt die Ursache
#   RUF059      entpackte Variable, die nie benutzt wird
# Importsortierung (I) und zip(strict=) (B905) waeren rund 60 Aenderungen
# ohne einen gefangenen Fehler. Nicht aufgenommen.
select = ["E4", "E7", "E9", "F", "B904", "RUF059"]
