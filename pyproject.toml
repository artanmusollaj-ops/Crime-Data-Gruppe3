# Projektdefinition fuer Crime-Data-Gruppe3.
#
# Die beiden Pipelines liegen unter src/crime/ und werden von hier aus als
# Pakete bekannt gemacht. Mit einer editierbaren Installation
#
#     python -m pip install -r requirements.txt
#
# sind chicago_pipeline und detroit_pipeline ueberall importierbar, ohne dass
# PYTHONPATH gesetzt werden muss.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crime-data-gruppe3"
version = "0.1.0"
description = "Ingestion und Aufbereitung von Kriminalitaetsdaten aus Chicago und Detroit"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "pyarrow>=18,<30",
    # Liest die TIGER-Shapefiles direkt aus dem ZIP nach Arrow, mit der
    # Geometrie als WKB - deutlich leichter als geopandas, das dafuer nicht
    # noetig ist.
    "pyogrio>=0.8,<1",
    "python-dotenv>=1.1,<2",
    "requests>=2.32,<3",
    # ZoneInfo("America/Detroit") braucht auf Systemen ohne IANA-Datenbank
    # (v.a. Windows) die mitgelieferten Zeitzonendaten.
    "tzdata; sys_platform == 'win32'",
    "urllib3>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src/crime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Fallback, damit die Tests auch ohne Installation laufen.
pythonpath = ["src/crime"]
