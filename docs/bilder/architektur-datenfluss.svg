    <text x="555" y="170" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="11" fill="currentColor" fill-opacity="0.72">5 Stufen: tract, place, weather_day, crime_offense, source_change</text>
  </g>
  <text x="24" y="150" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="currentColor" fill-opacity="0.8">silver</text>
  <text x="24" y="168" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.6">gedeutet: Typen, Einheiten, Schlüssel</text>
  <line x1="555" y1="76" x2="555" y2="124" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.1" marker-end="url(#pfeil)"/>
  <g>
    <rect x="274" y="232" width="562" height="52" rx="5" fill="currentColor" fill-opacity="0.045" stroke="currentColor" stroke-width="1.1"/>
