  <text x="24" y="358" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="currentColor" fill-opacity="0.8">serving</text>
  <text x="24" y="376" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.6">lokal gebaut; als Release publiziert</text>
  <line x1="555" y1="284" x2="555" y2="332" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.1" marker-end="url(#pfeil)"/>
  <text x="24" y="462" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.6">Aus orchestration.run_all.STUFEN erzeugt. Abbruch beim ersten Fehler; die Reihenfolge ist real, nicht dekorativ.</text>
</svg>
