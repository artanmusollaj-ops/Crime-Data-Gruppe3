  @media (prefers-color-scheme: dark) {
    svg { color: #dde5ee; }
    .signal { fill: #dda05c; }
    .signal-strich { stroke: #dda05c; }
  }
</style>
  <defs><marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="currentColor"/></marker></defs>
  <g>
    <rect x="274" y="24" width="562" height="52" rx="5" fill="currentColor" fill-opacity="0.045" stroke="currentColor" stroke-width="1.1"/>
    <text x="555" y="49" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" fill="currentColor">raw + bronze</text>
    <text x="555" y="66" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="11" fill="currentColor" fill-opacity="0.72">6 Stufen: chicago, detroit, tiger_tract, tiger_place, acs, noaa</text>
  </g>
  <text x="24" y="46" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="currentColor" fill-opacity="0.8">ingestion</text>
  <text x="24" y="64" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="11" font-weight="400" fill="currentColor" fill-opacity="0.6">je Lauf ein Verzeichnis, unveränderlich</text>
  <g>
    <rect x="274" y="128" width="562" height="52" rx="5" fill="currentColor" fill-opacity="0.045" stroke="currentColor" stroke-width="1.1"/>
