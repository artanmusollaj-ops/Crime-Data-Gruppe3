    <text x="555" y="361" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" fill="currentColor">serving</text>
    <text x="555" y="378" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="11" fill="currentColor" fill-opacity="0.72">3 Stufen: comparison, analyse_db, tracts_geojson</text>
