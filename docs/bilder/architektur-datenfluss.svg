<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 474" role="img" width="100%" height="auto"
     aria-label="Der Datenfluss in vier Gruppen mit 15 Stufen: Ingestion schreibt raw und bronze, silver deutet, gold baut das Sternschema, serving stellt bereit - und ein gruener Lauf wird zum Release.">
<style>
  svg { color: #14304a; }
  .signal { fill: #c2410c; }
