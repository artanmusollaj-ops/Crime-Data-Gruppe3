    <text x="323" y="398" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="11.5" fill="currentColor" fill-opacity="0.78">732 Zeilen · Stadt und Tag</text>
    <text x="323" y="415" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="currentColor" fill-opacity="0.55">temp_max_c · snowfall_mm</text>
