    <text x="323" y="68" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="11.5" fill="currentColor" fill-opacity="0.78">366 Zeilen · ein Kalendertag</text>
    <text x="323" y="85" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="currentColor" fill-opacity="0.55">month · is_weekend</text>
