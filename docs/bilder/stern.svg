  <text x="550" y="218" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="currentColor" fill-opacity="0.75">nibrs_code</text>
  <text x="14" y="446" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif" font-size="12.5" fill="currentColor" fill-opacity="0.7">Jede Frage ist ein Filter, ein GROUP BY und ein JOIN — die Dimensionen tragen die Auswahllisten gleich mit.</text>
