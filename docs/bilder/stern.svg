<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 452" role="img" width="100%" height="auto"
     aria-label="Das Sternschema: die Faktentabelle fact_offense in der Mitte, darum die vier Dimensionen dim_tract, dim_offense, dim_date und dim_city_day, je über einen Schlüssel verbunden.">
<style>
  svg { color: #14304a; }
  .signal { fill: #c2410c; }
  @media (prefers-color-scheme: dark) {
    svg { color: #dde5ee; }
    .signal { fill: #dda05c; }
  }
</style>
  <defs><marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
