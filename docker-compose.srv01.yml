# Die Strecke auf srv01 - der Serverbetrieb, nicht der Entwicklungsverbund.
#
#     docker compose -f docker-compose.srv01.yml up -d          # Dauerbetrieb
#     docker compose -f docker-compose.srv01.yml run --rm pipeline
#     docker compose -f docker-compose.srv01.yml --profile analyse up -d jupyter
#
# **Warum eine eigene Datei.** docker-compose.yml ist die Entwicklungsfassung:
# Sie bindet Ports an 127.0.0.1, kennt kein Traefik und keine Speichergrenzen,
# und sie muss auf dem Entwicklungsrechner weiter so laufen. Auf srv01 ist
# genau das falsch - dort gibt es keinen Host-Port 80/443, der Eingang ist ein
# ausgehender Cloudflare-Tunnel auf Traefik, und 7,7 GiB tragen schon fuenfzehn
# Dienste. Eine Datei, die beides sein will, ist in einem der beiden Faelle
# falsch; deshalb zwei, und die Begruendung jeder Zeile steht an ihrer Zeile.
#
# **Die Grenzen sind gemessen, nicht geschaetzt.** Am 6.10.2026 auf srv01
# (NFR-5, FR-13): 31 Container belegen 3'605 MiB, verfuegbar sind 4'325 MiB,
# und 2'418 von 4'095 MB Swap sind schon belegt. Die vorher veranschlagten
# 5'632 MiB lagen 1'307 MiB **ueber** dem Verfuegbaren. Je Dienst steht die
# Herkunft seiner Zahl an seinem mem_limit.
#
# **Die Geheimnisse stehen nicht hier.** Jede Variable ohne Wert holt sich
# Compose aus der ignorierten .env des Stapels (FR-18); diese Datei nennt nur
# Namen. Eine Variable, die dort fehlt, wird nicht in den Container gegeben -
# und CENSUS_API_KEY faellt dann vor dem Lauf auf, nicht bei Stufe 5 von 14
# (FR-19). **Das stimmte bis zum 12.10.2026 nicht.** Der Anstoss feuerte an
# jenem Tag zum ersten Mal und brach nach einer halben Stunde ab: Der
# Volllauf ruft die Pipelines einzeln, und die Pruefung sass dort, wo der
# Schluessel gebraucht wird. Chicago und Detroit waren da geladen und
# publiziert. Seither steht `orchestration.vorpruefung` als erste Zeile in
# docker/srv01-datenlauf.sh, und ein Test haelt die Reihenfolge.
#
# **Was diese Datei nicht leisten kann** und was deshalb daneben eingerichtet
# werden muss, steht in docs/storage-architektur.md, Abschnitt 16: die
# Tunnel-Route je Hostname auf http://traefik:80 (FR-12), die eine
# Access-Anwendung ueber urbancrime-* (FR-22), die Deckelung von cadvisor auf
# 256 MiB (Voraussetzung von FR-13) und der Eintrag des
# Elasticsearch-Datentraegers in config/srv01.yaml, damit Restic ihn sichert
# (FR-11).

# Ein eigener Projektname, nicht der Verzeichnisname. Traefik fasst die Labels
# **aller** Compose-Projekte zu einer Konfiguration zusammen; Router- und
# Dienstnamen muessen deshalb serverweit eindeutig sein, und die Datentraeger
# heissen dann vorhersagbar urbancrime_*.
name: urbancrime

services:

  # --------------------------------------------------------------------
  # Elasticsearch - Dauerbetrieb, aber kein Webdienst
  # --------------------------------------------------------------------
  elasticsearch:
    # Dieselbe Fassung wie in der Entwicklungsfassung. Ein Index, der hier
    # anders gebaut wird als dort, waere kein Beleg mehr fuer das, was auf dem
    # Entwicklungsrechner geprueft wurde.
    #
    # Genau das war vom 7. bis zum 11.10.2026 der Fall: #137 hob die
    # Entwicklungsfassung auf 8.19.22 und liess diese Datei auf 8.15.0 stehen.
    # Aufgefallen ist es nicht hier, sondern an ``docker compose ps`` auf
    # srv01. Die Zusage stand also drei Tage als Kommentar da, ohne dass ein
    # Test sie hielt - jetzt tut es
    # ``test_beide_fassungen_binden_dieselbe_elastic_version``.
    #
    # Die Fassung selbst (8.19.22, 23.9.2026) ist in der Entwicklungsfassung
    # begruendet; der Grund, warum sie hier ankommen muss, ist ``LOOKUP JOIN``:
    # Es ist erst ab 8.19 allgemein verfuegbar, und ohne es braucht jede
    # Verbundauswertung eine vorverbundene Tabelle in ``serving/``. Der Sprung
    # innerhalb der Hauptversion 8 verlangt keine Neuindizierung; im Zweifel
    # laedt ``python -m serving.load_elasticsearch`` jeden Index aus dem
    # Release neu.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.22
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Ohne diese Zeile verlangt Elasticsearch 8 Zertifikate und Passwoerter.
      # Geschuetzt wird hier nicht durch den Dienst, sondern dadurch, dass er
      # ausserhalb des Netzes urbancrime nicht erreichbar ist - kein ports:,
      # kein Traefik-Label, nicht im Netz proxy.
      xpack.security.enabled: "false"
      # 768 MiB Heap statt 1 GiB: Am 6.10.2026 gemessen nutzte der Heap
      # **195 von 1'024 MiB**. Die Haelfte des Container-Limits ist die
      # Elastic-Empfehlung, und 768 MiB lassen dem Lucene-Dateicache den Rest.
      ES_JAVA_OPTS: "-Xms768m -Xmx768m"
    # FR-11: **kein** Traefik-Label und **nicht** im Netz proxy. Ein
    # versehentliches Label an dieser Stelle waere ein offener Datenspeicher -
    # geroutet sind Kibana, Jupyter und die Einstiegsseite, nicht der
    # Datenspeicher darunter.
    networks:
      - urbancrime
    volumes:
      - elasticsearch-daten:/usr/share/elasticsearch/data
    # FR-13, gemessen am 6.10.2026: 1,75 GiB. Heap 768 MiB plus Lucene-Cache,
    # Threadstacks und JVM-Metaspace.
    mem_limit: 1792m
    # Nur hier, und nur fuer diesen Dienst: Ein Heap, der auf die Platte
    # ausgelagert wird, erzeugt Cluster-Zeitueberschreitungen statt
    # Langsamkeit. Auf srv01 sind 2'418 von 4'095 MB Swap schon belegt, das
    # Risiko ist also real. Pipeline und Jupyter bekommen die Zeile bewusst
    # **nicht**: Dort ist Swap der Rettungsanker eines einmaligen Laufs, und
    # ein langsamer Wochenlauf ist besser als ein getoeteter.
    memswap_limit: 1792m
    security_opt:
      - no-new-privileges:true
    logging:
      # FR-9 verlangt Logrotation fuer den Stapellauf; sie gilt hier fuer jeden
      # Dienst. Ohne Grenze waechst json-file unbegrenzt, und die Platte ist
      # mit 251 GB geteilt. Loki holt die Zeilen ohnehin ab (FR-24).
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      # Gelb genuegt: Ein einzelner Knoten bekommt seine Repliken nie
      # zugewiesen. Unsere Indizes fordern keine, Kibanas eigene tun es.
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 30s
      timeout: 10s
      retries: 20

  # --------------------------------------------------------------------
  # Kibana - Dauerbetrieb und geroutet
  # --------------------------------------------------------------------
  kibana:
    # Dieselbe Fassung wie Elasticsearch und wie die Entwicklungsfassung -
    # ``build_kibana`` spricht die Saved-Objects-API an, und die ist zwischen
    # den Nebenversionen das Empfindlichste am Stapel.
    image: docker.elastic.co/kibana/kibana:8.19.22
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      # Der Dienstname aus dieser Datei, im gemeinsamen Netz aufloesbar.
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      # Hinter dem Edge-TLS muss Kibana wissen, unter welcher Adresse es
      # oeffentlich steht; sonst baut es seine Links auf den Containernamen.
      SERVER_PUBLICBASEURL: https://urbancrime-kibana.datenwerft.ch
      SERVER_HOST: "0.0.0.0"
      # Ohne Wert - er kommt aus der .env des Stapels. In der
      # Entwicklungsfassung steht ein Platzhalter im Klartext; dort ist der
      # Dienst an 127.0.0.1 gebunden. Hier entscheidet der Schluessel, ob ein
      # neu aufgesetztes Kibana dieselben gespeicherten Objekte wiederfindet,
      # und gehoert deshalb nicht in eine Datei, die im Repository liegt.
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY:
    networks:
      # Zwei Netze: proxy, damit Traefik es erreicht, und urbancrime, damit es
      # Elasticsearch erreicht. Elasticsearch liegt nur im zweiten.
      - proxy
      - urbancrime
    volumes:
      - kibana-daten:/usr/share/kibana/data
    # FR-13, gemessen am 6.10.2026: Kibana belegte **771 MiB**. 1 GiB ist das
    # Gemessene plus Luft, nicht die Voreinstellung.
    mem_limit: 1024m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 30s
      timeout: 10s
      retries: 30
    labels:
      # FR-10, vollstaendig: enable, docker.network, Entrypoint, Host-Regel,
      # die X-Forwarded-Proto-Middleware und der Container-Port. Traefik laeuft
      # mit exposedByDefault=false - ohne traefik.enable ist der Container
      # privat, und mit einem halben Satz Labels ist er es auch, nur unbemerkt.
      traefik.enable: "true"
      traefik.docker.network: proxy
      # FR-22: urbancrime-<dienst>.datenwerft.ch. Die eine Access-Anwendung
      # ueber urbancrime-* deckt damit jeden kuenftigen Dienst mit; eine
      # vergessene Regel ist ein offener Dienst, ein Muster laesst sich nicht
      # vergessen. infra-* ist der Infrastruktur vorbehalten (FR-21).
      traefik.http.routers.urbancrime-kibana.rule: Host(`urbancrime-kibana.datenwerft.ch`)
      # TLS endet an der Cloudflare-Kante; von cloudflared zu Traefik ist es
      # HTTP im privaten Docker-Netz. Deshalb der Entrypoint web.
      traefik.http.routers.urbancrime-kibana.entrypoints: web
      traefik.http.routers.urbancrime-kibana.middlewares: urbancrime-kibana-proto
      traefik.http.routers.urbancrime-kibana.service: urbancrime-kibana
      # Die Middleware, ohne die es bricht: Kibana sieht sonst http:// und
      # baut Weiterleitungen dorthin - der Browser kommt von https:// und
      # laeuft in eine Schleife. Router- und Middlewarename tragen das Projekt
      # im Namen, weil Traefik alle Compose-Projekte zusammenfasst.
      traefik.http.middlewares.urbancrime-kibana-proto.headers.customrequestheaders.X-Forwarded-Proto: https
      # Der **Container**-Port, nicht ein Host-Port. Es gibt hier keinen.
      traefik.http.services.urbancrime-kibana.loadbalancer.server.port: "5601"

  # --------------------------------------------------------------------
  # Die Einstiegsseite - der dritte geroutete Webdienst (FR-31)
  # --------------------------------------------------------------------
  start:
    # Das amtliche nginx, per SHA-256-Digest gepinnt wie alles andere hier -
    # eine Marke laesst sich umhaengen, ein Digest nicht. Der Digest ist der
    # des Multi-Arch-Index von nginx:1.30.5-alpine, am 12.10.2026 mit
    # "docker buildx imagetools inspect" abgelesen; srv01 ist x86-64 und
    # bekommt daraus das amd64-Abbild.
    #
    # **Der stabile Zweig, nicht mainline.** nginx fuehrt zwei: 1.31.x bekommt
    # neue Funktionen, 1.30.x nur Korrekturen - und ``stable-alpine`` zeigt
    # heute auf genau diese 1.30.5. Ein Dienst, der dauernd und unbeaufsichtigt
    # eine statische Datei ausliefert, braucht keine neuen Funktionen; er
    # braucht, dass sich zwischen zwei Digests nichts anderes aendert als
    # Fehlerbehebungen. Dieselbe Ueberlegung wie bei Elasticsearch, wo die
    # letzte Nebenversion der 8er-Reihe steht. Die jeweils letzte Fassung des
    # Zweiges, weil ein zurueckgezogener Zweig auf einem Dauerdienst Monate
    # fehlender Korrekturen bedeutet.
    #
    # Alpine, weil dieser Dienst eine Datei ausliefert und nichts sonst - und
    # curl und grep liegen darin, der Healthcheck unten braucht beide. Kein
    # build: und keine Variable: Es ist ein fremdes Abbild aus Docker Hub,
    # kein hier gebautes (FR-3/E7, Registry).
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    networks:
      # Zwei Netze wie Kibana: proxy, damit Traefik es erreicht, und
      # urbancrime, damit es im Stapel unter seinem Namen aufloesbar ist.
      - proxy
      - urbancrime
    volumes:
      # Die Seite kommt aus einem benannten Datentraeger, **nicht** aus einem
      # Bind-Mount des Repositorys: Ein eingehaengtes docs/einstieg.html
      # zeigte das Release des letzten "git pull" und nicht das geladene -
      # und waere im Serverstapel der einzige Einhaengepunkt seiner Art.
      # Geschrieben wird er vom Stapellauf am Ende des Datenlaufs
      # (python -m serving.build_einstieg --adressen server), gelesen hier
      # **nur** lesend. Derselbe Weg wie bei arbeitsdaten, nur ein eigener
      # Datentraeger: arbeitsdaten traegt den ganzen Arbeitsraum samt
      # Release, und nginx liefert aus seiner Wurzel alles aus, was darin
      # liegt.
      - startseite:/usr/share/nginx/html:ro
    # FR-13: Die Messung vom 6.10.2026 sagt, wie viel Platz es gibt - 4'325
    # MiB verfuegbar, davon waren 4'096 MiB verplant, also 229 MiB frei. 32 MiB
    # ist das obere Ende dessen, was ein nginx mit einer statischen Datei
    # belegt (16-32 MiB); mehr als eine Datei liefert er hier nicht aus. Mit
    # diesem Dienst sind es 4'128 MiB verplant und 197 MiB frei.
    mem_limit: 32m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      # Nicht "der Port ist offen", und auch nicht nur HTTP 200: Geprueft wird
      # ein Kennzeichen **unserer** Seite. Der Grund ist am 12.10.2026 am
      # laufenden Docker nachgestellt worden - ein leerer benannter
      # Datentraeger wird beim ersten Start **aus dem Abbild befuellt**, und
      # das :ro oben verhindert das nicht. Danach liegen nginx' eigene
      # index.html und 50x.html darin, HTTP 200 kommt zurueck, und ein
      # Healthcheck auf "curl -fs" meldete den Dienst gesund, waehrend er
      # hinter Access die Willkommensseite von nginx auslieferte. Der Griff
      # nach der Fusszeile unserer Seite faellt genau dann, wenn noch kein
      # Datenlauf sie geschrieben hat.
      test: ["CMD-SHELL", "curl -fs http://localhost/ | grep -q 'serving.build_einstieg'"]
      interval: 30s
      timeout: 10s
      retries: 10
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      # FR-22, dasselbe Muster: urbancrime-start.datenwerft.ch. Nicht
      # urbancrime.datenwerft.ch - das ist der **einzige** Hostname, den das
      # Muster urbancrime-* nicht deckt, und damit der einzige, den die eine
      # Access-Anwendung nicht schuetzt. Nichts hier ist oeffentlich.
      traefik.http.routers.urbancrime-start.rule: Host(`urbancrime-start.datenwerft.ch`)
      traefik.http.routers.urbancrime-start.entrypoints: web
      traefik.http.routers.urbancrime-start.middlewares: urbancrime-start-proto
      traefik.http.routers.urbancrime-start.service: urbancrime-start
      traefik.http.middlewares.urbancrime-start-proto.headers.customrequestheaders.X-Forwarded-Proto: https
      traefik.http.services.urbancrime-start.loadbalancer.server.port: "80"

  # --------------------------------------------------------------------
  # Die Strecke - ein Stapellauf, kein Dienst
  # --------------------------------------------------------------------
  pipeline:
    # Das Abbild kommt aus einer Registry, nicht aus einem build: hier
    # (FR-3/E7). srv01 verbietet den Bau auf dem Host - "large frontend builds
    # have previously exhausted RAM" -, und das Actions-Budget ist erschoepft:
    # gebaut wird auf einem Entwicklungsrechner, dann geschoben. Die .env des
    # Stapels setzt PIPELINE_IMAGE auf die per SHA-256-Digest gepinnte
    # Adresse; die Vorgabe hier ist der lokal gebaute Name, damit die
    # Beschreibung auch ohne diesen Eintrag gueltig bleibt.
    image: ${PIPELINE_IMAGE:-urban-crime:latest}
    # FR-9: **nie** unless-stopped. Der Container laeuft einmal durch und
    # endet; mit unless-stopped wuerde aus einem Wochenlauf eine
    # Dauerschleife, die jede Woche neue Bronze-Laeufe anhaeuft. on-failure
    # statt "no", damit ein abgebrochener Netzzugriff nicht gleich den ganzen
    # Lauf verliert - begrenzt, weil ein Lauf, der dreimal scheitert, ein
    # Problem hat und keinen vierten Versuch.
    restart: on-failure:2
    # Nicht im Dauerbetrieb: Das Profil haelt ihn aus "up -d" heraus.
    # Angestossen wird er mit "run --rm pipeline" (FR-15, Welle 5) - und genau
    # deshalb darf seine Grenze mit Jupyters Grenze um denselben Platz
    # streiten (FR-13).
    profiles:
      - stapel
    # FR-9: **kein** ports: und **kein** Traefik-Label. Ein Stapellauf ist
    # nichts, was von aussen erreichbar sein muesste.
    networks:
      # Nur das Stapelnetz: Es braucht Elasticsearch (fuer die Lader) und den
      # Weg nach draussen zu den Quellen und zu SeaweedFS. Nicht proxy - dort
      # hat ein Stapellauf nichts zu suchen.
      - urbancrime
    environment:
      # Entschieden: SeaweedFS ist der Bestand, lokal nur Arbeitsraum, die
      # lokale Kopie wird nach dem Publizieren entfernt. Das ist kein
      # Geheimnis und steht deshalb hier und nicht in der .env - ein
      # Serverlauf, der versehentlich in local liefe, publizierte nichts und
      # saehe dabei gruen aus.
      STORAGE_BACKEND: s3
      # **Auslagern statt abbrechen.** Am 16.10.2026 starb der Lauf bei
      # ``silver crime_offense``: "could not allocate block of size 256.0 KiB
      # (854.6 MiB/854.4 MiB used)". DuckDB nimmt sich einen Teil des
      # Containerspeichers und bricht ab, wenn er nicht reicht - ausser es
      # darf auf Platte ausweichen. Das Verzeichnis liegt auf dem
      # ``arbeitsdaten``-Datentraeger, demselben, in dem der Lauf ohnehin
      # schreibt; Restic sichert es nicht, denn es ist Zwischenstand.
      #
      # Die anderen beiden Stellschrauben, die DuckDB selbst nennt, scheiden
      # aus: ``preserve_insertion_order=false`` aenderte die Zeilenfolge, und
      # ``publish`` schreibt ohne ORDER BY - zwei Bauten muessen byteweise
      # gleich sein. Mehr Speicher gaebe es nur auf Kosten anderer Dienste;
      # am 6.10. belegten 31 Container 3'605 von 4'325 MiB.
      DUCKDB_TEMP_DIRECTORY: /app/data/duckdb-tmp
      # Ohne Werte: Endpunkt, Bucket und Schluessel kommen aus der .env des
      # Stapels. Der Endpunkt steht nicht hier, weil SeaweedFS auf derselben
      # Maschine laeuft und die .env entscheidet, ob das der oeffentliche Name
      # oder ein stapelinterner ist - FR-46 verlangt, dass nichts im Abbild
      # und nichts hier srv01 voraussetzt.
      S3_ENDPOINT:
      S3_BUCKET:
      S3_ACCESS_KEY:
      S3_SECRET_KEY:
      CENSUS_API_KEY:
      SOCRATA_APP_TOKEN:
      # FR-14: Die Lader nehmen die Dienstadresse aus der Umgebung; ein
      # getipptes --url sticht sie weiterhin. Im Verbund heisst der Dienst
      # nach seinem Namen im Netz, und ein Container tippt kein --url.
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KIBANA_URL: http://kibana:5601
      # FR-61: DuckDB von innen begrenzen, unterhalb des Container-Limits.
      # Ohne Angabe nimmt DuckDB rund 80 % des Arbeitsspeichers der
      # **Maschine** - nicht des Containers -, und das waeren hier 6,3 GiB auf
      # einer Maschine mit fuenfzehn Nachbardiensten. Das Container-Limit
      # allein genuegt nicht: Es toetet den Prozess, statt ihn zu bremsen.
      # Zwei Threads von vier vCPU, weil jeder Thread eigene Puffer haelt.
      #
      # **16.10.2026: von 896MB auf 1536MB.** Drei Laeufe starben bei
      # ``silver crime_offense`` an genau dieser Grenze ("854.6 MiB/854.4 MiB
      # used"), der dritte, nachdem das Aufraeumen die gelesenen Laeufe von
      # 141 auf 52 gedrittelt hatte - die Menge war also nicht der Treiber.
      # ``dmesg`` zeigte keinen OOM-Killer: Es war immer DuckDBs eigene
      # Grenze, nie der Host. Von den drei Auswegen, die DuckDB vorschlaegt,
      # ist dies der einzige, der die Parquet-Bytes **nicht** aendert;
      # ``threads`` und ``preserve_insertion_order`` tun es, gemessen am
      # 13.10.2026, und wuerden die Reproduzierbarkeitswaechter brechen.
      # 1'536 MB von 2'048 MiB lassen dem Interpreter, pyarrow und pyogrio
      # den Rest.
      DUCKDB_MEMORY_LIMIT: 1536MB
      DUCKDB_THREADS: "2"
    volumes:
      # Arbeitsraum, kein Bestand: Im Modus s3 ist SeaweedFS der Bestand, und
      # die lokale Kopie wird nach dem Publizieren entfernt. Gebraucht wird
      # das Verzeichnis trotzdem - fuer .part-Ordner, das atomare Umbenennen
      # und die Pruefungen auf dem fertigen lokalen Ergebnis. Ein benannter
      # Datentraeger statt eines namenlosen, damit Jupyter denselben lesen
      # kann und damit er nicht in config/srv01.yaml gehoert: Was Restic
      # sichern muss, ist der Bucket, nicht dieser Zwischenstand.
      - arbeitsdaten:/app/data
      # Dorthin schreibt der Lauf die Einstiegsseite (FR-31). Er leert das
      # Verzeichnis vorher (siehe docker/srv01-datenlauf.sh): Docker befuellt
      # einen leeren benannten Datentraeger beim ersten Start aus dem Abbild,
      # und nginx' eigene index.html und 50x.html blieben sonst liegen - und
      # nginx liefert aus seiner Wurzel alles aus, was darin liegt. Nach dem
      # Lauf traegt der Datentraeger genau unsere eine Datei.
      - startseite:/app/startseite
    # **Am 16.10.2026 von 1,25 auf 2 GiB erhoeht**, weil die innere
    # DuckDB-Grenze darunter liegen muss und 896 MB dreimal nicht gereicht
    # haben (Begruendung oben bei DUCKDB_MEMORY_LIMIT). Gegen das heute
    # Verfuegbare (3'726 MiB) ist das eine Obergrenze, keine Reservierung:
    # belegt waren im Lauf 854 MiB.
    #
    # FR-13, Budget gemessen am 6.10.2026 - Dauerbetrieb 2'848 MiB plus das
    # groesste Zeitweilige 2'048 macht 4'896 von 5'116 MiB. Zeitweilig, nicht
    # Dauerbetrieb.
    mem_limit: 2048m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # --------------------------------------------------------------------
  # Jupyter - lesende Analyse (E9)
  # --------------------------------------------------------------------
  jupyter:
    # Nicht das Strecken-Abbild: Dort liegen weder jupyterlab noch die
    # Notebooks (requirements.lock traegt ipykernel und nbconvert, keinen
    # Server; .dockerignore haelt notebooks/ draussen). Das Analyse-Abbild ist
    # das Strecken-Abbild plus jupyterlab und die Notebooks **ohne**
    # 36_hypothesen - es misst Hardware und startet Neubauten, und auf einer
    # geteilten, auslagernden Maschine misst es das Rauschen der Nachbarn
    # (E9). Gebaut wird es wie das andere auf einem Entwicklungsrechner und
    # per Digest in der .env des Stapels gepinnt; die Beschreibung ist
    # Dockerfile.jupyter, der Befehl steht in docs/storage-architektur.md,
    # Abschnitt 16.
    image: ${JUPYTER_IMAGE:-urban-crime-jupyter:latest}
    restart: unless-stopped
    # Zeitweilig, wie die Pipeline: Das Profil haelt ihn aus "up -d" heraus,
    # damit der Dauerbetrieb aus Elasticsearch, Kibana und der kleinen
    # Einstiegsseite besteht und die Summe der Grenzen aufgeht (FR-13).
    # Gestartet wird er von Hand:
    #   docker compose -f docker-compose.srv01.yml --profile analyse up -d jupyter
    profiles:
      - analyse
    networks:
      - proxy
      - urbancrime
    environment:
      # Ohne Wert - das Token steht in der .env des Stapels. Der eigentliche
      # Zugang liegt davor: Cloudflare Access ueber urbancrime-* (FR-22), dazu
      # die zeitlich begrenzte, nur lesende Policy fuer die Pruefenden
      # (FR-23). Ein Notebook-Server ist eine Shell; ein Token allein waere
      # zu wenig.
      JUPYTER_TOKEN:
      # FR-61, wie bei der Pipeline: 512 MiB von 768 MiB. Gelesen werden
      # Tabellen aus der Release-Datenbank, nicht gebaut - der Rest ist
      # Interpreter und Darstellung. Keine S3-Schluessel: Die Datenbank aus
      # dem Release ist selbstaendig, und ein lesender Analysedienst braucht
      # keinen Zugang zum Bucket.
      DUCKDB_MEMORY_LIMIT: 512MB
      # Auslagern statt abbrechen - derselbe Grund wie bei pipeline.
      # **Nicht** nach /app/data: Dort haengt der Arbeitsdatentraeger
      # schreibgeschuetzt (`:ro`), und DuckDB scheiterte beim ersten
      # Auslagern statt bei der Abfrage - eine Verschlimmbesserung.
      DUCKDB_TEMP_DIRECTORY: /app/arbeit/duckdb-tmp
      DUCKDB_THREADS: "2"
    volumes:
      # E9, erste Auflage: data/ **schreibgeschuetzt**. Damit kann
      # 12_detroit_bronze_ingestion strukturell nicht in den echten Bestand
      # schreiben - der Schreibversuch scheitert am Dateisystem und nicht an
      # einer Absprache. Gelesen wird die **selbstaendige** analyse.duckdb aus
      # dem Release unter /app/data/releases/release=<Kennung>/serving/,
      # 93 MB, mit Tabellen darin. **Nicht** data/serving/analyse.duckdb: Die
      # traegt 17 Sichten mit absoluten Pfaden auf den Entwicklungsrechner und
      # ist im Container wertlos. Hereingeholt wird das Release mit
      #   docker compose -f docker-compose.srv01.yml run --rm pipeline \
      #     python -m orchestration.release holen aktuell --nur-datenbank
      - arbeitsdaten:/app/data:ro
      # Der eigene beschreibbare Arbeitsbereich - und JupyterLabs Wurzel.
      # Eigene Analysen liegen hier und ueberleben Neustart und
      # Abbildwechsel. Die drei mitgelieferten Notebooks liegen im Abbild
      # unter /vorlagen und werden beim ersten Start **einmal** hierher
      # gelegt, solange hier nichts liegt; danach fasst der Einstieg nichts
      # mehr an - wer eine Vorlage bearbeitet, bearbeitet seine Kopie, und
      # die Fassung im Abbild bleibt die ausgelieferte.
      #
      # Unter /app und nicht daneben: Die Notebooks suchen ihre
      # Projektwurzel beim Arbeitsverzeichnis und eine Ebene darueber
      # (erkannt an config/). /app/arbeit findet damit /app - mit config/,
      # mit dem schreibgeschuetzten data/ und mit dem installierten Code;
      # ein Arbeitsbereich unter /arbeit liesse jedes der drei Notebooks in
      # seiner ersten Zelle abbrechen.
      - jupyter-arbeit:/app/arbeit
    # Die Wurzel steht hier **und** in der Konfiguration im Abbild. Hier,
    # damit sie beim Lesen dieser Datei nicht geraten werden muss; dort,
    # damit ein vergessener Schalter nicht /app zur Wurzel macht und config/,
    # src/ und den ganzen Bestand in den Dateibaum des Browsers legt. Ein
    # Test haelt die beiden Angaben gegeneinander.
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--ServerApp.root_dir=/app/arbeit"]
    # FR-13, gemessen am 6.10.2026: 768 MiB. Zeitweilig, nicht Dauerbetrieb -
    # und ohne die Deckelung von cadvisor auf 256 MiB passt dieser Dienst
    # ueberhaupt nicht.
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      # **Nicht /api/status**: Am 6.10.2026 im gebauten Abbild gemessen
      # (jupyter-server 2.21.1) antwortet es **ohne Token mit 403**, und der
      # Dienst waere dauerhaft "unhealthy", obwohl er laeuft. /login gibt
      # unangemeldet 200 - es ist die Seite, die der Server selbst
      # ausliefert, also ein Beweis, dass die Anwendung steht und nicht nur
      # der Port offen ist. Das Token hier mitzugeben waere die schlechtere
      # Antwort: Dann haengt die Gesundheit des Dienstes daran, dass die .env
      # des Stapels eines setzt.
      test: ["CMD-SHELL", "curl -fs http://localhost:8888/login"]
      interval: 30s
      timeout: 10s
      retries: 10
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.urbancrime-jupyter.rule: Host(`urbancrime-jupyter.datenwerft.ch`)
      traefik.http.routers.urbancrime-jupyter.entrypoints: web
      traefik.http.routers.urbancrime-jupyter.middlewares: urbancrime-jupyter-proto
      traefik.http.routers.urbancrime-jupyter.service: urbancrime-jupyter
      traefik.http.middlewares.urbancrime-jupyter-proto.headers.customrequestheaders.X-Forwarded-Proto: https
      traefik.http.services.urbancrime-jupyter.loadbalancer.server.port: "8888"

networks:
  # Traefiks Netz, von der Ingress-Beschreibung angelegt ("docker network
  # create proxy"). external, weil es dieser Stapel nicht besitzt - er tritt
  # bei. Nur Kibana, Jupyter und start liegen darin.
  proxy:
    external: true
  # Das Netz des Stapels: Hier finden sich Elasticsearch, Kibana, Pipeline,
  # Jupyter und start unter ihren Dienstnamen. Es wird von diesem Stapel
  # angelegt und endet mit ihm.
  urbancrime:
    driver: bridge

volumes:
  # Die beiden, die in config/srv01.yaml gehoeren (FR-11): Ein neu gebauter
  # Index ist in Minuten wiederherstellbar, Kibanas gespeicherte Objekte sind
  # es nur, solange der Verschluesselungsschluessel derselbe bleibt.
  elasticsearch-daten:
  kibana-daten:
  # Arbeitsraum der Strecke, lesend von Jupyter mitbenutzt. Nicht
  # sicherungswuerdig: Der Bestand liegt auf SeaweedFS.
  arbeitsdaten:
  jupyter-arbeit:
  # Die Einstiegsseite (FR-31): vom Stapellauf geschrieben, von start
  # ausgeliefert. Nicht sicherungswuerdig - sie entsteht in Sekunden neu aus
  # dem Release, und ohne Release ist sie wertlos.
  startseite:
